@(user: &User, csrf: &str)

<header class="container">
  <nav aria-label="Main navigation">
    <ul><li><a class="c-info" href="/"><strong>Guard</strong></a></li></ul>
    <ul class="d-none d-md-flex">
      <li><a class="c-info" href="/">My account</a></li>
      @if matches!(user.role, Role::Admin) { <li><a class="c-info" href="/admin">Administration</a></li> }
      <li>
        <form method="POST" action="/logout">
          <input type="hidden" name="csrf_token" value="@csrf">
          <button type="submit" role="button" class="btn btn-info btn-outline">Log out</button>
        </form>
      </li>
    </ul>
    <ul class="d-md-none">
      <li>
        <details class="dropdown">
          <summary role="button" class="btn btn-info btn-outline">Account</summary>
          <ul dir="rtl">
            <li dir="ltr"><a class="c-info" href="/">My account</a></li>
            @if matches!(user.role, Role::Admin) { <li dir="ltr"><a class="c-info" href="/admin">Administration</a></li> }
            <li dir="ltr">
              <form method="POST" action="/logout">
                <input type="hidden" name="csrf_token" value="@csrf">
                <button type="submit" role="button" class="btn btn-info btn-outline">Log out</button>
              </form>
            </li>
          </ul>
        </details>
      </li>
    </ul>
  </nav>
  <hr>
</header>
