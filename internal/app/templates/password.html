{{if .Data.Error}}
  <div class="alert alert-error" role="alert">{{.Data.Error}}</div>
{{end}}
<form method="post" action="/login/password">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <input type="hidden" name="login_token" value="{{.Data.Login.InternalToken}}">
  <label for="email">Username</label>
  <input id="email" type="text" name="email" placeholder="Your username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required>
  <button type="submit" class="btn btn-info">Sign in</button>
</form>
