@(user: &User, csrf: &str)

@use "../components/header" as Header
@use "../layout/main" as Layout

<Layout title="My account">
  <Header user=@user csrf=@csrf />
  <main class="container" id="main-content">
    <h1>Welcome, @(user.username)</h1>
    <p><a class="btn btn-info" role="button" href="/account/security">Manage security</a></p>
    <div class="row">
      <section class="col-12">
        <dl>
          <dt>Username</dt><dd>@(user.username)</dd>
          <dt>Role</dt><dd>@if matches!(user.role, Role::Admin) { Administrator } else { User }</dd>
          <dt>Sign-in access</dt><dd><span class="badge badge-success">Active</span></dd>
          <dt>Account created</dt><dd>@(user.created_at)</dd>
        </dl>
      </section>
    </div>
  </main>
</Layout>
