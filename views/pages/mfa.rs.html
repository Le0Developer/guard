@(csrf: &str, has_totp: &bool, has_keys: &bool, error: &Option<String>)
@use "../layout/main" as Layout
<Layout title="Verify sign-in">
  <main class="container" id="main-content">
    <h1>Verify sign-in</h1>
    @if let Some(error) = error { <div class="alert alert-error" role="alert">@error</div> }
    @if *has_totp {
      <form method="POST" action="/login/mfa">
        <input type="hidden" name="csrf_token" value="@csrf"><input type="hidden" name="method" value="totp">
        <label for="authenticator-code">Authenticator code</label>
        <input id="authenticator-code" name="code" inputmode="numeric" pattern="[0-9][0-9][0-9][0-9][0-9][0-9]" maxlength="6" autocomplete="one-time-code" required autofocus>
        <button class="btn btn-info" type="submit">Verify code</button>
      </form>
    }
    @if *has_keys {
      <form method="POST" action="/login/mfa/key/start" data-webauthn="authenticate" data-finish="/login/mfa/key/finish">
        <input type="hidden" name="csrf_token" value="@csrf">
        <button class="btn btn-info" type="submit">Use security key</button>
        <p role="status" aria-live="polite" data-status></p>
      </form>
    }
    <details>
      <summary>Use a backup code</summary>
      <form method="POST" action="/login/mfa">
        <input type="hidden" name="csrf_token" value="@csrf"><input type="hidden" name="method" value="backup">
        <label for="backup-code">Backup code</label><input id="backup-code" name="code" autocomplete="off" spellcheck="false" maxlength="80" required>
        <button class="btn btn-info" type="submit">Use backup code</button>
      </form>
    </details>
    <p><a class="c-info" href="/login">Start over</a></p>
  </main>
  <script src="/static/security.js" defer></script>
</Layout>
